name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so new advisories against already-shipped deps get flagged
    # even when nobody pushes.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Fail on high/critical advisories in production + dev deps.
      - run: npm audit --audit-level=high
      - run: npm audit signatures

  build:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
